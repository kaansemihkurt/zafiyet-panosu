name: deploy
# Ana dala birleşen her değişiklik Azure Static Web Apps'e yayınlanır.
# Elle çalıştırma: "config" girdisiyle güvenlik başlıksız (baseline) sürüm yayınlanabilir — yalnızca ZAP önce/sonra karşılaştırması için.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      config:
        description: "Yayınlanacak SWA yapılandırması"
        type: choice
        options: [hardened, baseline]
        default: hardened

permissions:
  contents: read   # en az yetki: yalnızca depoyu okur

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 20 }
      - run: npm test
        working-directory: api
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m unittest pipeline/test_fetch_data.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Son veriyi "data" dalından al
        run: |
          mkdir -p app/data
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "https://github.com/${{ github.repository }}.git" datastore
            cp datastore/cves.json datastore/trend.json datastore/meta.json app/data/
          else
            echo "::warning::data dalı henüz yok — önce 'data' iş akışını çalıştırın"
          fi
      - name: SWA yapılandırmasını seç
        run: cp "config/staticwebapp.config.${{ github.event.inputs.config || 'hardened' }}.json" app/staticwebapp.config.json
      - name: Azure Static Web Apps'e yayınla
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: app
          api_location: api
          output_location: ""
          skip_app_build: true
