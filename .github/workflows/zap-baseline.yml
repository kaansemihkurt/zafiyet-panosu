name: zap-baseline
# OWASP ZAP baseline (pasif) taraması — YALNIZCA kendi ürün adresimize.
# Rapor, iş akışının "Artifacts" bölümünden indirilir (zap_scan).
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Taranacak adres (yalnızca kendi SWA adresiniz, ör. https://xxx.azurestaticapps.net)"
        required: true
      label:
        description: "Etiket (once / sonra)"
        required: true
        default: once

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Hedefin bizim SWA alanımız olduğunu doğrula
        env:
          TARGET: ${{ github.event.inputs.target }}
        run: |
          echo "$TARGET" | grep -Eq '^https://[a-z0-9-]+\.[0-9]*\.?azurestaticapps\.net/?$' || { echo "Yalnızca kendi azurestaticapps.net adresimiz taranabilir"; exit 1; }
      - uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ github.event.inputs.target }}
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap_${{ github.event.inputs.label }}
